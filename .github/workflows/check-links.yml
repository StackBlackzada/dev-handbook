name: Check links

on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda, 9h UTC
  pull_request:
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,403,429 "**/*.md"
          fail: true
